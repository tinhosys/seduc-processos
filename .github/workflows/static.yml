# Workflow para deploy de conteúdo estático para o GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site estático (ignorar binários pesados)
        run: |
          mkdir -p _site
          # Copiar apenas os arquivos necessários para o frontend estático do GitHub Pages
          cp -r index.html cadastro.html css js img proalfa.json _site/ 2>/dev/null || true
          # Se houver outros arquivos estáticos leves na raiz necessários
          cp favicon.ico _site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
